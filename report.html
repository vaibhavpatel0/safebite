<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeByte — Full Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* This page only: the report on the left, a live chat docked right. */
    body.report-mode { height: 100dvh; overflow: hidden; background: var(--bg); }

    .rep-shell { display: flex; flex-direction: column; height: 100dvh; }

    .rep-top {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 13px 22px;
      background: rgba(246,244,239,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .rep-title { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .rep-title h1 {
      font-family: var(--serif); font-weight: 400; font-size: 22px;
      color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rep-title span { font-size: 12.5px; color: var(--text3); white-space: nowrap; }
    .rep-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .rep-btn {
      padding: 8px 15px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text2); font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .rep-btn:hover { color: var(--text); border-color: var(--border2); }
    .rep-btn-go { background: var(--green); border-color: var(--green); color: #fff; }
    .rep-btn-go:hover { background: #1B4A30; color: #fff; border-color: #1B4A30; }

    .rep-cols { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }

    .rep-main { overflow-y: auto; padding: 26px 24px 60px; }
    .rep-main-inner { max-width: 820px; margin: 0 auto; }

    .rep-side {
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
      background: var(--bg2);
    }
    .rep-side-head {
      flex: 0 0 auto; padding: 13px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 9px;
    }
    .rep-side-head strong { font-size: 14px; color: var(--text); font-weight: 600; }
    .rep-side-head span { font-size: 12px; color: var(--text3); }

    .rep-thread {
      flex: 1 1 auto; overflow-y: auto;
      padding: 18px 16px 10px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .rep-composer {
      flex: 0 0 auto; display: flex; gap: 8px; align-items: flex-end;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
    }
    #repInput {
      flex: 1; resize: none; padding: 10px 15px;
      border-radius: 19px !important; font-family: inherit; font-size: 14.5px;
      line-height: 1.5; max-height: 110px;
    }

    .rep-empty {
      text-align: center; padding: 80px 24px; color: var(--text2);
    }
    .rep-empty h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; margin-bottom: 12px; color: var(--text); }
    .rep-empty p { font-size: 15px; line-height: 1.65; max-width: 420px; margin: 0 auto 22px; }

    .rep-section-head {
      font-family: var(--serif); font-weight: 400; font-size: 25px;
      color: var(--text); margin: 34px 0 14px;
    }
    .rep-section-head:first-child { margin-top: 0; }

    @media (max-width: 1000px) {
      body.report-mode { overflow: auto; height: auto; }
      .rep-shell { height: auto; }
      .rep-cols { grid-template-columns: 1fr; }
      .rep-main { overflow: visible; }
      .rep-side { border-left: none; border-top: 1px solid var(--border); height: 70vh; }
    }
    @media print {
      .rep-top, .rep-side { display: none !important; }
      body.report-mode { overflow: visible; height: auto; }
      .rep-main { overflow: visible; padding: 0; }
    }
  </style>
</head>
<body class="report-mode">

  <div class="rep-shell">
    <header class="rep-top">
      <div class="rep-title">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <path d="M14 2L24 7V14C24 19.5 19.5 24.5 14 26C8.5 24.5 4 19.5 4 14V7L14 2Z" fill="#235C3C"/>
          <path d="M9.5 14l3 3 6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 id="repProduct">Full Report</h1>
        <span id="repWhen"></span>
      </div>
      <div class="rep-actions">
        <button class="rep-btn" onclick="window.print()">Print / PDF</button>
        <a class="rep-btn" href="index.html">Back to chat</a>
        <a class="rep-btn rep-btn-go" id="repComplain" href="complaint.html">File a complaint</a>
      </div>
    </header>

    <div class="rep-cols">
      <main class="rep-main">
        <div class="rep-main-inner" id="repBody">
          <div class="rep-empty">
            <h2>Nothing to show yet</h2>
            <p>This page shows the last package you scanned. Scan one first and the full breakdown will appear here.</p>
            <a class="rep-btn rep-btn-go" href="index.html">Go and scan a package</a>
          </div>
        </div>
        <!-- engine renders into this -->
        <div id="resultsContainer" style="display:none"></div>
      </main>

      <aside class="rep-side">
        <div class="rep-side-head">
          <strong>Ask about this product</strong>
          <span id="repProvider"></span>
        </div>
        <div class="rep-thread" id="repThread"></div>
        <form class="rep-composer" onsubmit="event.preventDefault(); repSend();">
          <textarea id="repInput" rows="1" placeholder="Ask anything…"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();repSend();}"></textarea>
          <button type="submit" class="composer-send" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </form>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="engine.js"></script>
  <script src="store.js"></script>
  <script src="medicine.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const data = SafeByteStore.load();
    if (!data) return;

    // Hand the engine its state back
    currentAnalysis = data;
    chatHistory = [];

    $('repProduct').textContent = data.info.productName || 'Full Report';
    $('repWhen').textContent = data.timestamp ? new Date(data.timestamp).toLocaleString() : '';

    // ---- the report itself, rendered by the engine -------------------------
    try {
      renderResults(data);
      $('repBody').innerHTML = '<h2 class="rep-section-head">Compliance report</h2>' +
        $('resultsContainer').innerHTML;
    } catch (e) {
      console.error('[SafeByte] report render failed', e);
    }

    // ---- packaging + the closing table, appended -----------------------------
    try {
      const p = (typeof assessPackaging === 'function') ? assessPackaging(data.info) : null;
      if (p) {
        const envWord = { good:'recyclable', fair:'partly recyclable', poor:'not recyclable', unknown:'unknown' }[p.env];
        const tone = { yes:'ok', depends:'warn', caution:'bad', unknown:'warn' }[p.foodSafe] || 'warn';
        $('repBody').insertAdjacentHTML('beforeend', `
          <h2 class="rep-section-head">The packaging</h2>
          <div class="result-card" style="padding:22px;">
            <div class="pack-card pack-${tone}">
              <div class="pack-name">${esc(p.known ? p.name : 'No material marking found')}</div>
              <div class="pack-verdict">${esc(p.verdict)}</div>
              <div class="pack-grid">
                <div><span>Food contact</span><strong>${
                  {yes:'Safe',depends:'Safe for the food',caution:'Questionable',unknown:'Unknown'}[p.foodSafe] || 'Unknown'}</strong></div>
                <div><span>After you finish it</span><strong>${esc(envWord)}</strong></div>
              </div>
              <p style="margin-top:14px;font-size:14px;line-height:1.65;color:var(--text2);">${esc(p.detail)}</p>
              <p style="margin-top:10px;font-size:14px;line-height:1.65;color:var(--text2);"><strong>Afterwards.</strong> ${esc(p.recycling)}</p>
            </div>
          </div>`);
      }
    } catch (e) { console.warn('[SafeByte] packaging section', e); }

    // ---- chat, reusing the engine's model call -----------------------------
    function bub(role, html) {
      const d = document.createElement('div');
      d.className = 'msg msg-' + role;
      d.innerHTML = role === 'agent'
        ? `<span class="msg-mark"></span><div class="msg-body">${html}</div>`
        : `<div class="msg-body">${html}</div>`;
      $('repThread').appendChild(d);
      $('repThread').scrollTop = $('repThread').scrollHeight;
      return d;
    }

    function fmt(t) {
      let h = esc(t);
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/(^|\n)\s*[-*]\s+(.+)/g, '$1<li>$2</li>');
      h = h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
      return '<p>' + h.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
    }

    const c = data.compliance;
    bub('agent', `<p>This is the full report for <strong>${esc(data.info.productName || 'this product')}</strong>. ` +
      (c.failCount ? `${c.failCount} mandatory declaration${c.failCount===1?'':'s'} missing.` : `Everything mandatory is present.`) +
      ` Ask me anything about it, everything on the left is in front of me.</p>`);

    window.repSend = async function () {
      const el = $('repInput');
      const text = (el.value || '').trim();
      if (!text) return;
      el.value = ''; el.style.height = 'auto';
      bub('you', `<p>${esc(text)}</p>`);
      const dots = bub('agent', '<span class="dots"><i></i><i></i><i></i></span>');
      try {
        const reply = await callGeminiChat(text);
        chatHistory.push({ role:'user', parts:[{ text }] });
        chatHistory.push({ role:'model', parts:[{ text: reply }] });
        dots.remove();
        bub('agent', fmt(reply));
        if (typeof lastProvider !== 'undefined' && lastProvider) $('repProvider').textContent = 'via ' + lastProvider;
      } catch (err) {
        dots.remove();
        bub('agent', `<p><em>Could not answer just then, ${esc(err.message || 'providers busy')}.</em></p>`);
      }
    };

    $('repInput').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 110) + 'px';
    });
  })();
  </script>
</body>
</html>
